name: Mon Manager Web APK

on:
  # Heavy Android builds are intentionally opt-in to preserve Actions minutes.
  # Normal pushes to main no longer build an APK. Use "Run workflow" when an APK
  # is actually needed, or create a v*/apk-* tag for a deliberate release build.
  workflow_dispatch:
  push:
    tags:
      - "v*"
      - "apk-*"
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "gradlew.bat"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/android-build.yml"

concurrency:
  group: mon-manager-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wrapper-ready:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.wrapper.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: wrapper
        shell: bash
        run: |
          if [ -s gradlew ] && [ -s gradle/wrapper/gradle-wrapper.jar ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: wrapper-ready
    if: needs.wrapper-ready.outputs.ready == 'true'
    uses: jasmin-abernathy/app-build-factory/.github/workflows/android-build.yml@main
    with:
      java_version: "17"
      android_platform: "36"
      build_tools: "35.0.0"
      gradle_tasks: "testDebugUnitTest assembleDebug lintDebug"
      artifact_path: "app/build/outputs/apk/debug/app-debug.apk"
      artifact_name: "mon-manager-web-debug"
      retention_days: 7
