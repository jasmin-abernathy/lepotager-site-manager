name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wrapper-ready:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.wrapper.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - id: wrapper
        shell: bash
        run: |
          if [ -s gradlew ] && [ -s gradle/wrapper/gradle-wrapper.jar ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: wrapper-ready
    if: needs.wrapper-ready.outputs.ready == 'true'
    uses: jasmin-abernathy/app-build-factory/.github/workflows/android-build.yml@main
    with:
      java_version: "17"
      android_platform: "36"
      build_tools: "35.0.0"
      gradle_tasks: "testDebugUnitTest assembleDebug lintDebug"
      artifact_path: "app/build/outputs/apk/debug/app-debug.apk"
      artifact_name: "lepotager-site-manager-debug"
      retention_days: 14
