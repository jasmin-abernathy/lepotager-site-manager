name: Bootstrap Gradle Wrapper

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-gradle-wrapper.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Generate official wrapper
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          printf 'rootProject.name = "wrapper-bootstrap"\n' > "$tmp/settings.gradle"
          (cd "$tmp" && gradle wrapper --gradle-version 8.11.1 --distribution-type bin)
          cp "$tmp/gradlew" ./gradlew
          cp "$tmp/gradlew.bat" ./gradlew.bat
          mkdir -p ./gradle/wrapper
          cp "$tmp/gradle/wrapper/gradle-wrapper.jar" ./gradle/wrapper/gradle-wrapper.jar
          chmod +x ./gradlew
          ./gradlew --version
      - name: Commit wrapper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          git update-index --chmod=+x gradlew
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: add official Gradle 8.11.1 wrapper"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
